server:
  port: 8080

spring:
  profiles:
    active: dev

  mvc:
    # Springfox/Knife4j 在 Spring Boot 2.6+ 必须使用 ant 匹配策略
    pathmatch:
      matching-strategy: ant_path_matcher

  # H2 内嵌数据库（开发环境，无需安装MySQL）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/course_selection;AUTO_SERVER=TRUE;MODE=MySQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      # 脚本按 UTF-8 读取，避免中文乱码
      encoding: UTF-8
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/data.sql

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.course.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 公开仓库不要写死密钥：本地开发用这个默认值，部署时用环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:YXNkZmFzZGZhc2RmYXNkZmFzZGZhc2RmYXNkZmFzZGZhc2RmYQ==}
  expiration: 86400000

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh-CN

# 日志
logging:
  level:
    com.example.course: debug
