# MySQL 生产环境配置
# 使用方式: 修改 application.yml 中 spring.profiles.active: mysql
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/course_selection?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    # 默认值只供本地开发；公开仓库请用环境变量 MYSQL_PASSWORD 覆盖
    password: ${MYSQL_PASSWORD:root}
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never
